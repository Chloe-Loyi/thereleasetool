    <script type="text/babel">
        const { useState, useEffect } = React;

        const t = {
            en: {

                invalidCreds: "Invalid User ID or Password!",

            },
            zh: {
                title: "正念释放",
                langToggle: "EN",
                loginTitle: "欢迎来到正念释放",
                signupTab: "注册账号",
                loginTab: "登录账号",
                userId: "用户名 / 账号",
                password: "密码",
                loginBtn: "登录",
                signupBtn: "注册",
                logout: "退出登录",
                newGoal: "你想实现或释放什么目标？",
                deadline: "实现期限 (可选)",
                add: "添加目标",
                noDeadline: "无期限",
                active: "进行中",
                achieved: "已实现",
                expired: "已逾期",
                markAchieved: "已实现",
                release: "释放",
                reactivate: "再次激活",
                frustration: "释放挫败感",
                delete: "删除",
                history: "释放记录",
                created: "创建于",
                target: "期限",
                loop: "次循环",
                desirePrompt: "感受此刻浮现出来什么感受，问自己可以放开这个：",
                control: "想要控制",
                approval: "想要认同",
                security: "想要安全",
                releaseQ1: "感受此刻浮现出来什么感受，问自己可以放开这个",
                releaseQ2: "吗？",
                hasLeft: "它走了吗？",
                yes: "是的",
                no: "还没",
                continueQ: "是否要继续觉察和释放？",
                finish: "结束本次释放",
                cycle: "第",
                time: "次激活",
                backup: "备份数据",
                restore: "恢复备份",
                userExists: "该用户名已被注册！",
                invalidCreds: "用户名或密码错误！",
                signupSuccess: "注册成功！请登录。"
            }
        };

        function App() {
            const [lang, setLang] = useState('zh');
            const [currentUser, setCurrentUser] = useState(null);
            
            const [authMode, setAuthMode] = useState('login');
            const [usernameInput, setUsernameInput] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [authError, setAuthError] = useState('');
            const [authSuccess, setAuthSuccess] = useState('');

            const [goals, setGoals] = useState([]);
            const [newGoalText, setNewGoalText] = useState('');
            const [newGoalDate, setNewGoalDate] = useState('');
            
            const [activeRelease, setActiveRelease] = useState(null);
            const [wizardStep, setWizardStep] = useState(0); 
            const [currentDesire, setCurrentDesire] = useState('');
            const [loopCount, setLoopCount] = useState(0);

            useEffect(() => {
                const loggedIn = localStorage.getItem('zen_current_user');
                if (loggedIn) {
                    setCurrentUser(loggedIn);
                    loadUserData(loggedIn);
                }
            }, []);

            const loadUserData = (username) => {
                const userGoalsKey = `zen_goals_${username}`;
                const saved = localStorage.getItem(userGoalsKey);
                if (saved) {
                    try { setGoals(JSON.parse(saved)); } catch (e) { setGoals([]); }
                } else {
                    setGoals([]);
                }
            };

            useEffect(() => {
                if (currentUser) {
                    localStorage.setItem(`zen_goals_${currentUser}`, JSON.stringify(goals));
                }
            }, [goals, currentUser]);

            useEffect(() => {
                if (!currentUser) return;
                const today = new Date().toISOString().split('T')[0];
                setGoals(prev => prev.map(g => {
                    if (g.status === 'active' && g.deadline && g.deadline < today) {
                        return { ...g, status: 'expired' };
                    }
                    return g;
                }));
            }, [currentUser]);

            const getText = (key) => t[lang][key];

            const handleSignup = (e) => {
                e.preventDefault();
                setAuthError('');
                setAuthSuccess('');
                if (!usernameInput.trim() || !passwordInput.trim()) return;

                let users = {};
