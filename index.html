<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Release - 正念释放</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const t = {
            en: {
                title: "Zen Release",
                langToggle: "中文",
                newGoal: "What do you want to achieve or release?",
                deadline: "Deadline (Optional)",
                add: "Add Goal",
                noDeadline: "No deadline",
                active: "Active",
                achieved: "Achieved",
                expired: "Expired",
                markAchieved: "Mark Achieved",
                release: "Release",
                reactivate: "Activate Again",
                frustration: "Release Frustration",
                delete: "Delete",
                history: "Release History",
                created: "Created",
                target: "Target",
                loop: "loops",
                desirePrompt: "Acknowledge the feeling present right now. Which core desire is present?",
                control: "Wanting to Control",
                approval: "Wanting Approval",
                security: "Wanting Security",
                releaseQ1: "Could you let go of this",
                releaseQ2: "?",
                hasLeft: "Has it left?",
                yes: "Yes",
                no: "Not yet",
                continueQ: "Would you like to continue observing and releasing?",
                finish: "Finish Session",
                cycle: "Cycle",
                time: "time",
                backup: "Backup Data",
                restore: "Restore Data"
            },
            zh: {
                title: "正念释放",
                langToggle: "EN",
                newGoal: "你想实现或释放什么目标？",
                deadline: "实现期限 (可选)",
                add: "添加目标",
                noDeadline: "无期限",
                active: "进行中",
                achieved: "已实现",
                expired: "已逾期",
                markAchieved: "已实现",
                release: "释放",
                reactivate: "再次激活",
                frustration: "释放挫败感",
                delete: "删除",
                history: "释放记录",
                created: "创建于",
                target: "期限",
                loop: "次循环",
                desirePrompt: "感受此刻浮现出来什么感受，问自己可以放开这个：",
                control: "想要控制",
                approval: "想要认同",
                security: "想要安全",
                releaseQ1: "感受此刻浮现出来什么感受，问自己可以放开这个",
                releaseQ2: "吗？",
                hasLeft: "它走了吗？",
                yes: "是的",
                no: "还没",
                continueQ: "是否要继续觉察和释放？",
                finish: "结束本次释放",
                cycle: "第",
                time: "次激活",
                backup: "备份数据",
                restore: "恢复备份"
            }
        };

        function App() {
            const [lang, setLang] = useState('zh');
            const [goals, setGoals] = useState([]);
            const [newGoalText, setNewGoalText] = useState('');
            const [newGoalDate, setNewGoalDate] = useState('');
            
            const [activeRelease, setActiveRelease] = useState(null);
            const [wizardStep, setWizardStep] = useState(0); 
            const [currentDesire, setCurrentDesire] = useState('');
            const [loopCount, setLoopCount] = useState(0);

            useEffect(() => {
                const saved = localStorage.getItem('zenGoals_local_tool');
                if (saved) {
                    try { setGoals(JSON.parse(saved)); } catch (e) { console.error(e); }
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('zenGoals_local_tool', JSON.stringify(goals));
            }, [goals]);

            useEffect(() => {
                const today = new Date().toISOString().split('T')[0];
                setGoals(prev => prev.map(g => {
                    if (g.status === 'active' && g.deadline && g.deadline < today) {
                        return { ...g, status: 'expired' };
                    }
                    return g;
                }));
            }, []);

            const getText = (key) => t[lang][key];

            const handleAddGoal = (e) => {
                e.preventDefault();
                if (!newGoalText.trim()) return;
                const newGoal = {
                    id: Date.now().toString(),
                    text: newGoalText,
                    createdAt: new Date().toISOString().split('T')[0],
                    deadline: newGoalDate || null,
                    status: 'active',
                    activationCount: 1,
                    history: []
                };
                setGoals([newGoal, ...goals]);
                setNewGoalText('');
                setNewGoalDate('');
            };

            const updateGoalStatus = (id, newStatus) => {
                setGoals(goals.map(g => g.id === id ? { ...g, status: newStatus } : g));
            };

            const reactivateGoal = (id) => {
                setGoals(goals.map(g => {
                    if (g.id === id) {
                        return { 
                            ...g, 
                            status: 'active', 
                            activationCount: (g.activationCount || 1) + 1,
                            deadline: '' 
                        };
                    }
                    return g;
                }));
            };

            const deleteGoal = (id) => {
                if (confirm(lang === 'zh' ? '确定要删除这个目标吗？' : 'Are you sure you want to delete this goal?')) {
                    setGoals(goals.filter(g => g.id !== id));
                }
            };

            const exportData = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(goals, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `zen_release_backup_${new Date().toISOString().split('T')[0]}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const importData = (e) => {
                const fileReader = new FileReader();
                if (e.target.files[0]) {
                    fileReader.readAsText(e.target.files[0], "UTF-8");
                    fileReader.onload = (event) => {
                        try {
                            const imported = JSON.parse(event.target.result);
                            if (Array.isArray(imported)) {
                                setGoals(imported);
                                alert(lang === 'zh' ? "数据导入成功！" : "Data restored successfully!");
                            }
                        } catch (error) {
                            alert(lang === 'zh' ? "文件格式错误" : "Invalid file format");
                        }
                    };
                }
            };

            const startRelease = (goal, presetDesire = '') => {
                setActiveRelease(goal);
                setCurrentDesire(presetDesire);
                setLoopCount(1);
                setWizardStep(presetDesire ? 2 : 1);
            };

            const handleDesireSelect = (desireKey) => {
                setCurrentDesire(getText(desireKey));
                setWizardStep(2);
            };

            const handleEmotionLeft = (left) => {
                if (left) {
                    setWizardStep(3); 
                } else {
                    setLoopCount(prev => prev + 1);
                }
            };

            const handleContinue = (wantsToContinue) => {
                if (wantsToContinue) {
                    setLoopCount(prev => prev + 1);
                    setWizardStep(1); 
                    setCurrentDesire('');
                } else {
                    finishReleaseSession();
                }
            };

            const finishReleaseSession = () => {
                setGoals(goals.map(g => {
                    if (g.id === activeRelease.id) {
                        return {
                            ...g,
                            history: [{
                                date: new Date().toISOString().split('T')[0],
                                desire: currentDesire || 'General',
                                loops: loopCount
                            }, ...g.history]
                        };
                    }
                    return g;
                }));
                setActiveRelease(null);
                setWizardStep(0);
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 font-sans p-4 md:p-8">
                    <div className="max-w-3xl mx-auto">
                        
                        <div className="flex justify-between items-center mb-8">
                            <h1 className="text-2xl text-teal-700 tracking-wider flex items-center gap-2 font-semibold">
                                <i data-lucide="refresh-cw" className="w-6 h-6"></i> {getText('title')}
                            </h1>
                            <div className="flex items-center gap-3">
                                <button onClick={exportData} title={getText('backup')} className="p-2 text-slate-500 hover:text-teal-600 bg-white rounded-lg shadow-sm border border-slate-100 transition">
                                    <i data-lucide="download" className="w-4 h-4"></i>
                                </button>
                                <label className="p-2 text-slate-500 hover:text-teal-600 bg-white rounded-lg shadow-sm border border-slate-100 transition cursor-pointer" title={getText('restore')}>
                                    <i data-lucide="upload" className="w-4 h-4"></i>
                                    <input type="file" onChange={importData} accept=".json" className="hidden" />
                                </label>
                                <button 
                                    onClick={() => setLang(lang === 'zh' ? 'en' : 'zh')}
                                    className="flex items-center gap-1 text-sm bg-white px-3 py-1.5 rounded-lg shadow-sm border border-slate-100 text-slate-600 hover:text-teal-600 transition"
                                >
                                    <i data-lucide="globe" className="w-4 h-4"></i> {getText('langToggle')}
                                </button>
                            </div>
                        </div>

                        <form onSubmit={handleAddGoal} className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 mb-8 flex flex-col md:flex-row gap-4">
                            <input
                                type="text"
                                value={newGoalText}
                                onChange={(e) => setNewGoalText(e.target.value)}
                                placeholder={getText('newGoal')}
                                className="flex-1 bg-slate-50 border-none rounded-lg px-4 py-3 focus:ring-2 focus:ring-teal-100 outline-none text-slate-700"
                            />
                            <input
                                type="date"
                                value={newGoalDate}
                                onChange={(e) => setNewGoalDate(e.target.value)}
                                className="bg-slate-50 border-none rounded-lg px-4 py-3 focus:ring-2 focus:ring-teal-100 outline-none text-slate-500"
                                title={getText('deadline')}
                            />
                            <button type="submit" className="bg-teal-600 text-white px-6 py-3 rounded-lg hover:bg-teal-700 transition flex justify-center items-center gap-2">
                                <i data-lucide="plus" className="w-5 h-5"></i> {getText('add')}
                            </button>
                        </form>

                        <div className="space-y-6">
                            {goals.map(goal => (
                                <div key={goal.id} className={`bg-white p-6 rounded-xl shadow-sm border-l-4 transition ${
                                    goal.status === 'active' ? 'border-teal-400' : 
                                    goal.status === 'expired' ? 'border-orange-400' : 'border-slate-300 opacity-70'
                                }`}>
                                    
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
                                        <div>
                                            <h3 className="text-lg font-medium text-slate-800">{goal.text}</h3>
                                            <div className="flex flex-wrap gap-4 text-xs text-slate-400 mt-2">
                                                <span className="flex items-center gap-1"><i data-lucide="calendar" className="w-3 h-3"></i> {getText('created')}: {goal.createdAt}</span>
                                                <span className="flex items-center gap-1">
                                                    <i data-lucide="target" className="w-3 h-3"></i> {getText('target')}: {goal.deadline ? goal.deadline : getText('noDeadline')}
                                                </span>
                                                {goal.activationCount > 1 && (
                                                    <span className="text-teal-600 bg-teal-50 px-2 py-0.5 rounded font-medium">
                                                        {lang === 'zh' ? `${getText('cycle')}${goal.activationCount}${getText('time')}` : `${getText('time')} ${goal.activationCount}`}
                                                    </span>
                                                )}
                                                {goal.status === 'expired' && (
                                                    <span className="text-orange-600 bg-orange-50 px-2 py-0.5 rounded font-medium">
                                                        {lang === 'zh' ? '已逾期' : 'Expired'}
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                        
                                        <div className="flex flex-wrap items-center gap-2">
                                            {goal.status === 'active' && (
                                                <>
                                                    <button onClick={() => updateGoalStatus(goal.id, 'achieved')} className="px-3 py-1.5 text-sm bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg flex items-center gap-1 transition">
                                                        <i data-lucide="check" className="w-4 h-4"></i> {getText('markAchieved')}
                                                    </button>
                                                    <button onClick={() => startRelease(goal)} className="px-4 py-1.5 text-sm bg-teal-50 text-teal-700 hover:bg-teal-100 rounded-lg flex items-center gap-1 transition">
                                                        <i data-lucide="refresh-cw" className="w-4 h-4"></i> {getText('release')}
                                                    </button>
                                                </>
                                            )}
                                            {goal.status === 'expired' && (
                                                <>
                                                    <button onClick={() => startRelease(goal, 'control')} className="px-3 py-1.5 text-sm bg-orange-50 text-orange-700 hover:bg-orange-100 rounded-lg transition font-medium">
                                                        {getText('frustration')}
                                                    </button>
                                                    <button onClick={() => reactivateGoal(goal.id)} className="px-3 py-1.5 text-sm bg-teal-50 text-teal-700 hover:bg-teal-100 rounded-lg transition font-medium">
                                                        {getText('reactivate')}
                                                    </button>
                                                </>
                                            )}
                                            {goal.status === 'achieved' && (
                                                <span className="px-3 py-1.5 text-sm bg-teal-50 text-teal-700 rounded-lg font-medium">{getText('achieved')}</span>
                                            )}
                                            {/* 删除按钮 */}
                                            <button onClick={() => deleteGoal(goal.id)} className="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition" title={getText('delete')}>
                                                <i data-lucide="trash-2" className="w-4 h-4"></i>
                                            </button>
                                        </div>
                                    </div>

                                    {goal.history.length > 0 && (
                                        <div className="mt-4 pt-4 border-t border-slate-100">
                                            <p className="text-xs font-medium text-slate-400 mb-3 uppercase tracking-wider">{getText('history')}</p>
                                            <div className="flex flex-wrap gap-2">
                                                {goal.history.map((h, i) => (
                                                    <div key={i} className="text-xs bg-slate-50 border border-slate-100 text-slate-600 px-3 py-1.5 rounded-full flex items-center gap-2">
                                                        <i data-lucide="clock" className="w-3 h-3 text-teal-600"></i>
                                                        {h.date} · [{h.desire}] · {h.loops} {getText('loop')}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>

                        {activeRelease && (
                            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex justify-center items-center z-50 p-4">
                                <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg p-8 relative">
                                    <button onClick={() => setActiveRelease(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                    
                                    <div className="mb-6 text-center">
                                        <p className="text-sm text-teal-600 font-medium">{activeRelease.text}</p>
                                        <p className="text-xs text-slate-400 mt-1">Loop: {loopCount}</p>
                                    </div>

                                    {wizardStep === 1 && (
                                        <div className="space-y-4">
                                            <h3 className="text-lg text-center text-slate-700 mb-6 font-medium">
                                                {getText('desirePrompt')}
                                            </h3>
                                            <button onClick={() => handleDesireSelect('control')} className="w-full p-4 border border-slate-200 rounded-xl hover:border-teal-500 hover:bg-teal-50 transition text-slate-700 font-medium">{getText('control')}</button>
                                            <button onClick={() => handleDesireSelect('approval')} className="w-full p-4 border border-slate-200 rounded-xl hover:border-teal-500 hover:bg-teal-50 transition text-slate-700 font-medium">{getText('approval')}</button>
                                            <button onClick={() => handleDesireSelect('security')} className="w-full p-4 border border-slate-200 rounded-xl hover:border-teal-500 hover:bg-teal-50 transition text-slate-700 font-medium">{getText('security')}</button>
                                        </div>
                                    )}

                                    {wizardStep === 2 && (
                                        <div className="text-center space-y-8">
                                            <h3 className="text-lg text-slate-700 leading-relaxed">
                                                {getText('releaseQ1')} <span className="text-teal-600 font-medium">[{currentDesire}]</span> {getText('releaseQ2')}
                                            </h3>
                                            <p className="text-sm text-slate-500 font-medium">{getText('hasLeft')}</p>
                                            <div className="flex gap-4 justify-center">
                                                <button onClick={() => handleEmotionLeft(true)} className="px-8 py-3 bg-teal-600 text-white rounded-xl hover:bg-teal-700 transition w-32 shadow-sm">{getText('yes')}</button>
                                                <button onClick={() => handleEmotionLeft(false)} className="px-8 py-3 bg-slate-100 text-slate-600 rounded-xl hover:bg-slate-200 transition w-32">{getText('no')}</button>
                                            </div>
                                        </div>
                                    )}

                                    {wizardStep === 3 && (
                                        <div className="text-center space-y-8">
                                            <h3 className="text-xl text-slate-700">{getText('continueQ')}</h3>
                                            <div className="flex gap-4 justify-center flex-col sm:flex-row">
                                                <button onClick={() => handleContinue(true)} className="px-6 py-3 bg-teal-50 text-teal-700 border border-teal-100 rounded-xl hover:bg-teal-100 transition font-medium">
                                                    {getText('yes')}
                                                </button>
                                                <button onClick={() => handleContinue(false)} className="px-6 py-3 bg-slate-800 text-white rounded-xl hover:bg-slate-700 transition font-medium">
                                                    {getText('finish')}
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
        setTimeout(() => { lucide.createIcons(); }, 100);
    </script>
</body>
</html>
