 goals.forEach(g=>{const card=document.createElement('article');card.className='card goal '+(g.status==='expired'?'expired':g.status==='achieved'?'achieved':'');const head=document.createElement('div');head.className='goalhead';const info=document.createElement('div');info.style.minWidth='0';const name=document.createElement('div');name.className='goalname';name.textContent=g.text;const meta=document.createElement('div');meta.className='metadata';[`${T('created')}: ${g.createdAt}`,`${T('target')}: ${g.deadline||T('none')}`,g.status==='active'?T('active'):g.status==='expired'?T('expired'):T('achieved'),g.activationCount>1?`${lang==='zh'?'第':''}${g.activationCount}${lang==='zh'?'次激活':' activations'}`:''].filter(Boolean).forEach(s=>{const span=document.createElement('span');span.textContent=s;meta.append(span)});info.append(name,meta);const actions=document.createElement('div');actions.className='actions';if(g.status==='active'){actions.append(btn(T('mark'),'subtle',()=>updateStatus(g.id,'achieved')),btn(T('release'),'primary',()=>startRelease(g,'')))}if(g.status==='expired'){actions.append(btn(T('frustration'),'subtle',()=>startRelease(g,'control')),btn(T('again'),'subtle',()=>reactivate(g.id)))}if(g.status==='achieved'){const span=document.createElement('span');span.className='muted';span.textContent=T('achieved');actions.append(span)}actions.append(btn(T('del'),'subtle danger',()=>deleteGoal(g.id)));head.append(info,actions);card.append(head);if(g.history.length){const hist=document.createElement('div');hist.className='history';const title=document.createElement('div');title.className='muted';title.textContent=T('history');hist.append(title);g.history.forEach(h=>{const item=document.createElement('span');item.className='history-item';item.textContent=`${h.date||''} · [${h.desire||''}] · ${h.loops||1} ${T('loop')}`;hist.append(item)});card.append(hist)}list.append(card)});updateAccessUI();
}
function btn(text,cls,fn){const b=document.createElement('button');b.type='button';b.className=cls;b.textContent=text;b.addEventListener('click',fn);return b}
function persist(){if(!user||!cloudReady){showNotice(lang==='zh'?'请先登录并完成云端加载。':'Please log in and wait for cloud data to load.','error');return}render();if(sb)queueCloudSave()}
function updateStatus(id,status){goals=goals.map(g=>g.id===id?{...g,status}:g);persist()}
function reactivate(id){goals=goals.map(g=>g.id===id?{...g,status:'active',activationCount:(g.activationCount||1)+1,deadline:null}:g);persist()}
function deleteGoal(id){if(confirm(T('deleteConfirm'))){goals=goals.filter(g=>g.id!==id);persist()}}
$('goalForm').addEventListener('submit',e=>{e.preventDefault();const text=$('goalInput').value.trim();if(!text)return;goals.unshift({id:String(Date.now()),text,createdAt:new Date().toISOString().slice(0,10),deadline:$('deadlineInput').value||null,status:'active',activationCount:1,history:[]});$('goalInput').value='';$('deadlineInput').value='';persist()});
$('langBtn').addEventListener('click',()=>{lang=lang==='zh'?'en':'zh';try{localStorage.setItem('rt_lang',lang)}catch(e){}document.documentElement.lang=lang==='zh'?'zh-CN':'en';clearNotice('globalNotice');clearNotice('authMessage');render();if(active)renderModal()});
$('backupBtn').addEventListener('click',()=>{if(!user||!cloudReady)return;const blob=new Blob([JSON.stringify(goals,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='the_releasing_tool_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url)});
$('restoreInput').addEventListener('change',async e=>{if(!user||!cloudReady){e.target.value='';return}const f=e.target.files?.[0];if(!f)return;try{const parsed=JSON.parse(await f.text());if(!Array.isArray(parsed))throw new Error(T('invalid'));goals=parsed.map(normalizeGoal);persist();showNotice(T('imported'),'success')}catch(err){showNotice(err.message||T('invalid'),'error')}e.target.value=''});
function startRelease(goal,preset){active=goal;desire=preset?T(preset):'';loops=1;qi=0;step=preset?2:1;renderModal();$('releaseModal').classList.remove('hidden')}
function renderModal(){if(!active)return;const Q=getQ();if(qi>=Q.length)qi=0;$('modalGoal').textContent=active.text;$('modalTitle').textContent=step===1?T('prompt'):step===2?fmtQ(Q[qi].q):T('continue');const body=$('modalBody');body.innerHTML='';if(step===1){[ ['control',T('control')],['approval',T('approval')],['security',T('security')] ].forEach(([k,label])=>body.append(btn(label,'choice',()=>{desire=T(k);step=2;qi=0;renderModal()})));const crow=document.createElement('div');crow.className='authrow';const cin=document.createElement('input');cin.className='field';cin.maxLength=60;cin.placeholder=T('customDesirePh');const cgo=btn(T('useCustom'),'primary',()=>{const v=cin.value.trim();if(!v){cin.focus();return}desire=v;step=2;qi=0;renderModal()});cin.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();cgo.click()}});cgo.style.flex='0 0 auto';crow.append(cin,cgo);body.append(crow)}else if(step===2){Q[qi].a.forEach(ans=>body.append(btn(ans.t,'choice',()=>{if(ans.act==='choose'){step=1;qi=0}else if(ans.act==='end'){step=3;qi=0}else if(ans.act==='repeat'){}else{qi++;if(qi>=Q.length){step=3;qi=0}}renderModal()})))}else{const p=document.createElement('p');p.style.textAlign='center';p.textContent=(lang==='zh'?'第':'Loop ')+loops+(lang==='zh'?' 次':'');body.append(p);const row=document.createElement('div');row.className='modalactions';row.append(btn(T('yes'),'primary',()=>{loops++;step=2;qi=0;renderModal()}),btn(T('finish'),'subtle',finishRelease));body.append(row)}}
function finishRelease(){if(active){const h={date:new Date().toISOString().slice(0,10),desire,loops};goals=goals.map(g=>g.id===active.id?{...g,history:[...(g.history||[]),h]}:g);persist()}active=null;$('releaseModal').classList.add('hidden')}
$('closeModalBtn').addEventListener('click',()=>{$('releaseModal').classList.add('hidden');active=null});$('releaseModal').addEventListener('click',e=>{if(e.target===$('releaseModal')){$('releaseModal').classList.add('hidden');active=null}});
function setAuthMode(mode){authMode=mode;clearNotice('authMessage');render()}
$('loginModeBtn').onclick=()=>setAuthMode('login');$('signupModeBtn').onclick=()=>setAuthMode('signup');$('resetModeBtn').onclick=()=>setAuthMode('reset');
$('authForm').addEventListener('submit',async e=>{e.preventDefault();clearNotice('authMessage');if(!sb){showNotice(lang==='zh'?'云端服务暂时不可用，请检查网络后重试。':'Cloud service is unavailable. Check your connection and try again.','warn','authMessage');return}const raw=$('emailInput').value.trim(),email=toEmail(raw),password=$('passwordInput').value,confirmPass=$('confirmInput').value;const submit=$('authSubmit');submit.disabled=true;try{let result;if(authMode==='signup'){if(password.length<8)throw new Error(T('minpass'));if(password!==confirmPass)throw new Error(T('mismatch'));result=await withTimeout(sb.auth.signUp({email,password,options:{emailRedirectTo:baseUrl()}}),12000,'Sign-up request timed out');if(result.error)throw result.error;if(result.data&&result.data.session){user=result.data.user||result.data.session.user;await loadCloudGoals(false);render();return}setAuthMode('login');showNotice(T('verify'),'success','authMessage')}else if(authMode==='reset'){result=await withTimeout(sb.auth.resetPasswordForEmail(email,{redirectTo:baseUrl()}),12000,'Password reset request timed out');if(result.error)throw result.error;showNotice(T('resetSent'),'success','authMessage')}else{result=await withTimeout(sb.auth.signInWithPassword({email,password}),12000,'Login request timed out');if(result.error)throw result.error;user=result.data.user||null;if(user)await loadCloudGoals(false);render();if(user&&cloudReady)showNotice(T('saved'),'success','authMessage')}}catch(err){showNotice(mapErr(err),'error','authMessage')}finally{submit.disabled=false}});
$('signOutBtn').addEventListener('click',async()=>{try{if(sb)await withTimeout(sb.auth.signOut(),10000,'Sign-out timed out')}catch(e){showNotice(e.message,'error')}user=null;customQ=null;cloudReady=false;goals=[];render();updateAccessUI()});
function withTimeout(p,ms,msg){return Promise.race([p,new Promise((_,reject)=>setTimeout(()=>reject(new Error(msg)),ms))])}
let saveTimer=null;function queueCloudSave(){clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{if(!sb||!user||!cloudReady)return;try{const {error}=await withTimeout(sb.from('zen_release_data').upsert({user_id:user.id,goals,updated_at:new Date().toISOString()},{onConflict:'user_id'}),12000,'Cloud save timed out');if(error)throw error;lastCloudError='';setStatus('saved')}catch(e){lastCloudError=e.message;showNotice(T('savefail')+e.message,'error');setStatus('savefail',e.message)}},500)}
async function loadCloudGoals(askImport){if(!sb||!user)return;cloudReady=false;{customQ=normalizeQ(user.user_metadata&&user.user_metadata.questions)}setStatus('loading');try{const {data,error}=await withTimeout(sb.from('zen_release_data').select('goals').eq('user_id',user.id).maybeSingle(),12000,'Cloud data request timed out');if(error)throw error;if(data){goals=Array.isArray(data.goals)?data.goals.map(normalizeGoal):[]}else{goals=[]}cloudReady=true;render();updateAccessUI();queueCloudSave();setStatus('ready');if(pendingRecovery){pendingRecovery=false;openRecovery()}}catch(e){cloudReady=false;showNotice(T('loadfail')+e.message,'error');setStatus('loadfail',e.message)}}
function initCloud(){const hasConfig=CONFIG.url.startsWith('https://')&&CONFIG.key&& !CONFIG.key.includes('YOUR_');if(!hasConfig){setStatus('noConfig');return}const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';script.onload=async()=>{try{const lib=window.supabase;if(!lib||!lib.createClient)throw new Error('Supabase client library did not expose createClient');sb=lib.createClient(CONFIG.url,CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});setStatus('ready');const result=await withTimeout(sb.auth.getSession(),8000,'Session check timed out');if(result.error)throw result.error;user=result.data.session?.user||null;if(user)await loadCloudGoals(false);else{goals=[];cloudReady=false;render();updateAccessUI()}sb.auth.onAuthStateChange((event,session)=>{const next=session?.user||null;if(next?.id===user?.id)return;user=next;cloudReady=false;if(!user){goals=[];render();updateAccessUI()}else{goals=[];render();updateAccessUI();loadCloudGoals(false)}})}catch(e){console.error(e);setStatus('local',' ('+e.message+')');showNotice((lang==='zh'?'云端连接失败，暂时无法使用。':'Cloud connection failed; the app is locked until it works.')+' '+e.message,'error');user=null;cloudReady=false;goals=[];updateAccessUI()}};script.onerror=()=>{setStatus('local');showNotice(lang==='zh'?'无法加载云端客户端，请检查网络后刷新。':'Could not load the cloud client. Check your connection and refresh.','error');user=null;cloudReady=false;goals=[];updateAccessUI()};document.head.append(script);setTimeout(()=>{if(!sb){setStatus('local');showNotice(lang==='zh'?'云端客户端加载超时，请检查网络后刷新。':'Cloud client timed out. Check your connection and refresh.','error');updateAccessUI()}},10000)}

function openModal(id){$(id).classList.remove('hidden')}
function closeModal(id){$(id).classList.add('hidden')}
$('pwBtn').addEventListener('click',()=>{$('pwNew').value='';$('pwConf').value='';clearNotice('pwMsg');openModal('pwModal')});
$('pwClose').addEventListener('click',()=>closeModal('pwModal'));
$('pwModal').addEventListener('click',e=>{if(e.target===$('pwModal'))closeModal('pwModal')});
$('pwForm').addEventListener('submit',async e=>{e.preventDefault();clearNotice('pwMsg');const p1=$('pwNew').value,p2=$('pwConf').value,b=$('pwSave');b.disabled=true;try{if(!sb||!user)throw new Error(lang==='zh'?'请先登录。':'Please log in first.');if(p1.length<8)throw new Error(T('minpass'));if(p1!==p2)throw new Error(T('mismatch'));const r=await withTimeout(sb.auth.updateUser({password:p1}),12000,'Password update timed out');if(r.error)throw r.error;if(r.data&&r.data.user)user=r.data.user;$('pwNew').value='';$('pwConf').value='';showNotice(T('pwDone'),'success','pwMsg')}catch(err){showNotice(mapErr(err),'error','pwMsg')}finally{b.disabled=false}});

function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function renderQEditor(){const box=$('qList');box.innerHTML='';qDraft.forEach((item,n)=>{const card=mk('div','');card.style.cssText='border:1px solid rgba(128,128,128,.35);border-radius:14px;padding:12px;display:grid;gap:10px;text-align:left';const head=mk('div','authrow');head.style.alignItems='center';const ttl=mk('strong','',lang==='zh'?'第 '+(n+1)+' 句':'Question '+(n+1));const dq=btn(T('delAns'),'subtle danger',()=>{qDraft.splice(n,1);renderQEditor()});dq.style.flex='0 0 auto';head.append(ttl,dq);const ta=document.createElement('textarea');ta.className='field';ta.rows=2;ta.maxLength=200;ta.value=item.q;ta.placeholder=T('qPlaceholder');ta.addEventListener('input',()=>{item.q=ta.value});card.append(head,mk('span','muted',T('qLabel')),ta);item.a.forEach((ans,i)=>{const wrap=mk('div','');wrap.style.cssText='display:grid;gap:6px';const h=mk('div','authrow');h.style.alignItems='center';const da=btn(T('delAns'),'subtle danger',()=>{item.a.splice(i,1);renderQEditor()});da.style.flex='0 0 auto';h.append(mk('span','muted',T('ansLabel')+' '+(i+1)),da);const inp=document.createElement('input');inp.className='field';inp.maxLength=60;inp.value=ans.t;inp.addEventListener('input',()=>{ans.t=inp.value});const sel=document.createElement('select');sel.className='field';ACTS.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=T('act_'+k);if(ans.act===k)o.selected=true;sel.append(o)});sel.addEventListener('change',()=>{ans.act=sel.value});wrap.append(h,inp,mk('span','muted',T('afterClick')),sel);card.append(wrap)});card.append(btn('＋ '+T('addAns'),'subtle',()=>{item.a.push({t:'',act:'next'});renderQEditor()}));box.append(card)})}
const cloneQ=x=>JSON.parse(JSON.stringify(x));
function cleanQ(){return qDraft.map(it=>({q:it.q.trim(),a:it.a.map(x=>({t:x.t.trim(),act:x.act})).filter(x=>x.t)})).filter(it=>it.q).map(it=>({q:it.q,a:it.a.length?it.a:[{t:T('next'),act:'next'}]}))}
$('qBtn').addEventListener('click',()=>{qDraft=cloneQ(getQ());clearNotice('qMsg');renderQEditor();openModal('qModal')});
$('qClose').addEventListener('click',()=>closeModal('qModal'));
$('qModal').addEventListener('click',e=>{if(e.target===$('qModal'))closeModal('qModal')});
$('qAddBtn').addEventListener('click',()=>{qDraft.push({q:'',a:[{t:'',act:'next'}]});renderQEditor();const t=$('qList').querySelectorAll('textarea');if(t.length)t[t.length-1].focus()});
async function saveQuestions(value){if(!sb||!user)throw new Error(lang==='zh'?'请先登录。':'Please log in first.');const r=await withTimeout(sb.auth.updateUser({data:{questions:value}}),12000,'Save timed out');if(r.error)throw r.error;if(r.data&&r.data.user)user=r.data.user;customQ=value}
$('qSaveBtn').addEventListener('click',async()=>{clearNotice('qMsg');const clean=cleanQ();if(!clean.length){showNotice(T('qEmpty'),'error','qMsg');return}const b=$('qSaveBtn');b.disabled=true;try{await saveQuestions(clean);qDraft=cloneQ(clean);renderQEditor();showNotice(T('qSaved'),'success','qMsg')}catch(err){showNotice(mapErr(err),'error','qMsg')}finally{b.disabled=false}});
$('qResetBtn').addEventListener('click',async()=>{clearNotice('qMsg');const b=$('qResetBtn');b.disabled=true;try{await saveQuestions(null);qDraft=cloneQ(getQ());renderQEditor();showNotice(T('qSaved'),'success','qMsg')}catch(err){showNotice(mapErr(err),'error','qMsg')}finally{b.disabled=false}});
// Render the core app immediately, before any remote script/network request.
document.documentElement.lang=lang==='zh'?'zh-CN':'en';goals=[];render();updateAccessUI();if(urlError){showNotice(urlError.code==='otp_expired'||/expired/i.test(urlError.desc)?T('linkExpired'):T('linkBad')+urlError.desc.replace(/\+/g,' '),'error','authMessage');pendingRecovery=false;try{history.replaceState(null,'',location.pathname)}catch(e){}}initCloud();
})();
