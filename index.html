<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Release - 正念释放</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const t = {
            en: {
                title: "Zen Release",
                langToggle: "中文",
                loginTitle: "Welcome to Zen Release",
                signupTab: "Sign Up",
                loginTab: "Log In",
                userId: "User ID",
                password: "Password",
                loginBtn: "Log In",
                signupBtn: "Sign Up",
                logout: "Log Out",
                newGoal: "What do you want to achieve or release?",
                deadline: "Deadline (Optional)",
                add: "Add Goal",
                noDeadline: "No deadline",
                active: "Active",
                achieved: "Achieved",
                expired: "Expired",
                markAchieved: "Mark Achieved",
                release: "Release",
                reactivate: "Activate Again",
                frustration: "Release Frustration",
                delete: "Delete",
                history: "Release History",
                created: "Created",
                target: "Target",
                loop: "loops",
                desirePrompt: "Acknowledge the feeling present right now. Which core desire is present?",
                control: "Wanting to Control",
                approval: "Wanting Approval",
                security: "Wanting Security",
                releaseQ1: "Could you let go of this",
                releaseQ2: "?",
                hasLeft: "Has it left?",
                yes: "Yes",
                no: "Not yet",
                continueQ: "Would you like to continue observing and releasing?",
                finish: "Finish Session",
                cycle: "Cycle",
                time: "time",
                backup: "Backup Data",
                restore: "Restore Data",
                userExists: "User ID already exists!",
                invalidCreds: "Invalid User ID or Password!",
                signupSuccess: "Account created successfully! Please log in."
            },
            zh: {
                title: "正念释放",
                langToggle: "EN",
                loginTitle: "欢迎来到正念释放",
                signupTab: "注册账号",
                loginTab: "登录账号",
                userId: "用户名 / 账号",
                password: "密码",
                loginBtn: "登录",
                signupBtn: "注册",
                logout: "退出登录",
                newGoal: "你想实现或释放什么目标？",
                deadline: "实现期限 (可选)",
                add: "添加目标",
                noDeadline: "无期限",
                active: "进行中",
                achieved: "已实现",
                expired: "已逾期",
                markAchieved: "已实现",
                release: "释放",
                reactivate: "再次激活",
                frustration: "释放挫败感",
                delete: "删除",
                history: "释放记录",
                created: "创建于",
                target: "期限",
                loop: "次循环",
                desirePrompt: "感受此刻浮现出来什么感受，问自己可以放开这个：",
                control: "想要控制",
                approval: "想要认同",
                security: "想要安全",
                releaseQ1: "感受此刻浮现出来什么感受，问自己可以放开这个",
                releaseQ2: "吗？",
                hasLeft: "它走了吗？",
                yes: "是的",
                no: "还没",
                continueQ: "是否要继续觉察和释放？",
                finish: "结束本次释放",
                cycle: "第",
                time: "次激活",
                backup: "备份数据",
                restore: "恢复备份",
                userExists: "该用户名已被注册！",
                invalidCreds: "用户名或密码错误！",
                signupSuccess: "注册成功！请登录。"
            }
        };

        function App() {
            const [lang, setLang] = useState('zh');
            const [currentUser, setCurrentUser] = useState(null);
            
            // Auth Form State
            const [authMode, setAuthMode] = useState('login'); // 'login' or 'signup'
            const [usernameInput, setUsernameInput] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [authError, setAuthError] = useState('');
            const [authSuccess, setAuthSuccess] = useState('');

            // App Data State
            const [goals, setGoals] = useState([]);
            const [newGoalText, setNewGoalText] = useState('');
            const [newGoalDate, setNewGoalDate] = useState('');
            
            const [activeRelease, setActiveRelease] = useState(null);
            const [wizardStep, setWizardStep] = useState(0); 
            const [currentDesire, setCurrentDesire] = useState('');
            const [loopCount, setLoopCount] = useState(0);

            // Check if user was already logged in via session
            useEffect(() => {
                const loggedIn = localStorage.getItem('zen_current_user');
                if (loggedIn) {
                    setCurrentUser(loggedIn);
                    loadUserData(loggedIn);
                }
            }, []);

            // Load specific user goals from localStorage
            const loadUserData = (username) => {
                const userGoalsKey = `zen_goals_${username}`;
                const saved = localStorage.getItem(userGoalsKey);
                if (saved) {
                    try { setGoals(JSON.parse(saved)); } catch (e) { setGoals([]); }
                } else {
                    setGoals([]);
                }
            };

            // Save user goals when they change
            useEffect(() => {
                if (currentUser) {
                    localStorage.setItem(`zen_goals_${currentUser}`, JSON.stringify(goals));
                }
            }, [goals, currentUser]);

            // Check expired goals daily
            useEffect(() => {
                if (!currentUser) return;
                const today = new Date().toISOString().split('T')[0];
                setGoals(prev => prev.map(g => {
                    if (g.status === 'active' && g.deadline && g.deadline < today) {
                        return { ...g, status: 'expired' };
                    }
                    return g;
                }));
            }, [currentUser]);

            const getText = (key) => t[lang][key];

            // --- Authentication Handlers ---
            const handleSignup = (e) => {
                e.preventDefault();
                setAuthError('');
                setAuthSuccess('');
                if (!usernameInput.trim() || !passwordInput.trim()) return;

                const users = JSON.parse(localStorage.getItem('zen_users') || '{}');
                if (users[usernameInput]) {
                    setAuthError(getText('userExists'));
                    return;
                }

                users[usernameInput] = passwordInput;
                localStorage.setItem('zen_users', JSON.stringify(users));
                setAuthSuccess(getText('signupSuccess'));
                setUsernameInput('');
                setPasswordInput('');
                setAuthMode('login');
            };

            const handleLogin = (e) => {
                e.preventDefault();
                setAuthError('');
                setAuthSuccess('');
                if (!usernameInput.trim() || !passwordInput.trim()) return;

                const users = JSON.parse(localStorage.getItem('zen_users') || '{}');
                if (users[usernameInput] && users[usernameInput] === passwordInput) {
                    setCurrentUser(usernameInput);
                    localStorage.setItem('zen_current_user', usernameInput);
                    loadUserData(usernameInput);
                    setUsernameInput('');
                    setPasswordInput('');
                } else {
                    setAuthError(getText('invalidCreds'));
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                localStorage.removeItem('zen_current_user');
                setGoals([]);
            };

            // --- Goal Management Handlers ---
            const handleAddGoal = (e) => {
                e.preventDefault();
                if (!newGoalText.trim()) return;
                const newGoal = {
                    id: Date.now().toString(),
                    text: newGoalText,
                    createdAt: new Date().toISOString().split('T')[0],
                    deadline: newGoalDate || null,
                    status: 'active',
                    activationCount: 1,
                    history: []
                };
                setGoals([newGoal, ...goals]);
                setNewGoalText('');
                setNewGoalDate('');
            };

            const updateGoalStatus = (id, newStatus) => {
                setGoals(goals.map(g => g.id === id ? { ...g, status: newStatus } : g));
            };

            const reactivateGoal = (id) => {
                setGoals(goals.map(g => {
                    if (g.id === id) {
                        return { 
                            ...g, 
                            status: 'active', 
                            activationCount: (g.activationCount || 1) + 1,
                            deadline: '' 
                        };
                    }
                    return g;
                }));
            };

            const deleteGoal = (id) => {
                if (confirm(lang === 'zh' ? '确定要删除这个目标吗？' : 'Are you sure you want to delete this goal?')) {
                    setGoals(goals.filter(g => g.id !== id));
                }
            };

            const exportData = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(goals, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `zen_release_backup_${currentUser}_${new Date().toISOString().split('T')[0]}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const importData = (e) => {
                const fileReader = new FileReader();
                if (e.target.files[0]) {
                    fileReader.readAsText(e.target.files[0], "UTF-8");
                    fileReader.onload = (event) => {
                        try {
                            const imported = JSON.parse(event.target.result);
                            if (Array.isArray(imported)) {
                                setGoals(imported);
                                alert(lang === 'zh' ? "数据导入成功！" : "Data restored successfully!");
                            }
                        } catch (error) {
                            alert(lang === 'zh' ? "文件格式错误" : "Invalid file format");
                        }
                    };
                }
            };

            const startRelease = (goal, presetDesire = '') => {
                setActiveRelease(goal);
                setCurrentDesire(presetDesire);
                setLoopCount(1);
                setWizardStep(presetDesire ? 2 : 1);
            };

            const handleDesireSelect = (desireKey) => {
                setCurrentDesire(getText(desireKey));
                setWizardStep(2);
            };

            const handleEmotionLeft = (left) => {
                if (left) {
                    setWizardStep(3); 
                } else {
                    setLoopCount(prev => prev + 1);
                }
            };

            const handleContinue = (wantsToContinue) => {
                if (wantsToContinue) {
                    setLoopCount(prev => prev + 1);
                    setWizardStep(1); 
                    setCurrentDesire('');
                } else {
                    finishReleaseSession();
                }
            };

            const finishReleaseSession = () => {
                setGoals(goals.map(g => {
                    if (g.id === activeRelease.id) {
                        return {
                            ...g,
                            history: [{
                                date: new Date().toISOString().split('T')[0],
                                desire: currentDesire || 'General',
                                loops: loopCount
                            }, ...g.history]
                        };
                    }
                    return g;
                }));
                setActiveRelease(null);
                setWizardStep(0);
            };

            // Render Login / Signup Screen if not logged in
            if (!currentUser) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col justify-center items-center p-4">
                        <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
                            <div className="flex justify-between items-center mb-6">
                                <h1 className="text-xl text-teal-700 font-semibold flex items-center gap-2">
                                    <i data-lucide="refresh-cw" className="w-5 h-5"></i> {getText('title')}
                                </h1>
                                <button 
                                    onClick={() => setLang(lang === 'zh' ? 'en' : 'zh')}
                                    className="flex items-center gap-1 text-xs bg-slate-50 px-2.5 py-1 rounded-lg text-slate-600 hover:text-teal-600 border border-slate-200 transition"
                                >
                                    <i data-lucide="globe" className="w-3.5 h-3.5"></i> {getText('langToggle')}
                                </button>
                            </div>

                            <div className="flex bg-slate-100 p-1 rounded-xl mb-6">
                                <button 
                                    onClick={() => { setAuthMode('login'); setAuthError(''); setAuthSuccess(''); }}
                                    className={`flex-1 py-2 text-sm font-medium rounded-lg transition ${authMode === 'login' ? 'bg-white text-teal-700 shadow-sm' : 'text-slate-500'}`}
                                >
                                    {getText('loginTab')}
                                </button>
                                <button 
                                    onClick={() => { setAuthMode('signup'); setAuthError(''); setAuthSuccess(''); }}
                                    className={`flex-1 py-2 text-sm font-medium rounded-lg transition ${authMode === 'signup' ? 'bg-white text-teal-700 shadow-sm' : 'text-slate-500'}`}
                                >
                                    {getText('signupTab')}
                                </button>
                            </div>

                            {authError && <div className="mb-4 p-3 bg-red-50 text-red-600 text-xs rounded-xl">{authError}</div>}
                            {authSuccess && <div className="mb-4 p-3 bg-teal-50 text-teal-600 text-xs rounded-xl">{authSuccess}</div>}

                            <form onSubmit={authMode === 'login' ? handleLogin : handleSignup} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-medium text-slate-500 mb-1">{getText('userId')}</label>
                                    <input
                                        type="text"
                                        value={usernameInput}
                                        onChange={(e) => setUsernameInput(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-teal-100 outline-none text-slate-700 text-sm"
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-500 mb-1">{getText('password')}</label>
                                    <input
                                        type="password"
                                        value={passwordInput}
                                        onChange={(e) => setPasswordInput(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-teal-100 outline-none text-slate-700 text-sm"
                                        required
                                    />
                                </div>
                                <button type="submit" className="w-full bg-teal-600 text-white py-3 rounded-xl hover:bg-teal-700 transition font-medium shadow-sm">
                                    {authMode === 'login' ? getText('loginBtn') : getText('signupBtn')}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // Render Main App Dashboard if logged in
            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 font-sans p-4 md:p-8">
                    <div className="max-w-3xl mx-auto">
                        
                        <div className="flex justify-between items-center mb-8">
                            <div className="flex items-center gap-3">
                                <h1 className="text-2xl text-teal-700 tracking-wider flex items-center gap-2 font-semibold">
                                    <i data-lucide="refresh-cw" className="w-6 h-6"></i> {getText('title')}
                                </h1>
                                <span className="text-xs bg-teal-50 text-teal-700 px-2.5 py-1 rounded-full font-medium">@{currentUser}</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={exportData} title={getText('backup')} className="p-2 text-slate-500 hover:text-teal-600 bg-white rounded-lg shadow-sm border border-slate-100 transition">
                                    <i data-lucide="download" className="w-4 h-4"></i>
                                </button>
                                <label className="p-2 text-slate-500 hover:text-teal-600 bg-white rounded-lg shadow-sm border border-slate-100 transition cursor-pointer" title={getText('restore')}>
                                    <i data-lucide="upload" className="w-4 h-4"></i>
                                    <input type="file" onChange={importData} accept=".json" className="hidden" />
                                </label>
                                <button 
                                    onClick={() => setLang(lang === 'zh' ? 'en' : 'zh')}
                                    className="flex items-center gap-1 text-sm bg-white px-3 py-1.5 rounded-lg shadow-sm border border-slate-100 text-slate-600 hover:text-teal-600 transition"
                                >
                                    <i data-lucide="globe" className="w-4 h-4"></i> {getText('langToggle')}
                                </button>
                                <button onClick={handleLogout} title={getText('logout')} className="p-2 text-slate-400 hover:text-red-600 bg-white rounded-lg shadow-sm border border-slate-100 transition">
                                    <i data-lucide="log-out" className="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>

                        <form onSubmit={handleAddGoal} className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 mb-8 flex flex-col md:flex-row gap-4">
                            <input
                                type="text"
                                value={newGoalText}
                                onChange={(e) => setNewGoalText(e.target.value)}
                                placeholder={getText('newGoal')}
                                className="flex-1 bg-slate-50 border-none rounded-lg px-4 py-3 focus:ring-2 focus:ring-teal-100 outline-none text-slate-700"
                            />
                            <input
                                type="date"
                                value={newGoalDate}
                                onChange={(e) => setNewGoalDate(e.target.value)}
                                className="bg-slate-50 border-none rounded-lg px-4 py-3 focus:ring-2 focus:ring-teal-100 outline-none text-slate-500"
                                title={getText('deadline')}
                            />
                            <button type="submit" className="bg-teal-600 text-white px-6 py-3 rounded-lg hover:bg-teal-700 transition flex justify-center items-center gap-2">
                                <i data-lucide="plus" className="w-5 h-5"></i> {getText('add')}
                            </button>
                        </form>

                        <div className="space-y-6">
                            {goals.map(goal => (
                                <div key={goal.id} className={`bg-white p-6 rounded-xl shadow-sm border-l-4 transition ${
                                    goal.status === 'active' ? 'border-teal-400' : 
                                    goal.status === 'expired' ? 'border-orange-400' : 'border-slate-300 opacity-70'
                                }`}>
                                    
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
                                        <div>
                                            <h3 className="text-lg font-medium text-slate-800">{goal.text}</h3>
                                            <div className="flex flex-wrap gap-4 text-xs text-slate-400 mt-2">
                                                <span className="flex items-center gap-1"><i data-lucide="calendar" className="w-3 h-3"></i> {getText('created')}: {goal.createdAt}</span>
                                                <span className="flex items-center
